<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Ali Coins</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <img src="../../icons/icon48.png" alt="" class="logo" />
    <div class="titles">
      <h1>Ali Coins</h1>
      <p class="subtitle">Check-in e tarefas do AliExpress</p>
    </div>
    <button id="btnOptions" class="icon-btn" type="button" title="Opções" aria-label="Abrir opções">⚙</button>
  </header>

  <section id="metricsBar" class="metrics hidden">
    <span id="metricBalance" class="chip hidden"></span>
    <span id="metricStreak" class="chip hidden"></span>
  </section>

  <section id="status" class="card status">
    <div class="status-line">
      <span id="statusDot" class="dot idle"></span>
      <strong id="statusPhase">Inativo</strong>
    </div>
    <p id="statusMessage" class="muted">Pronto para executar.</p>
    <p id="statusTiming" class="muted small"></p>
    <ul id="liveLog" class="report hidden"></ul>
  </section>

  <section id="warnings" class="warnings hidden">
    <div id="warnAlready" class="warn info hidden">
      ✓ O check-in de hoje <strong>já havia sido coletado</strong> — nenhuma moeda nova de check-in neste run.
    </div>
  </section>

  <section class="actions">
    <button id="btnRun" class="btn primary">▶ Executar agora</button>
    <button id="btnStop" class="btn danger hidden">■ Parar</button>
  </section>

  <section id="scheduleCard" class="card hidden">
    <h2>Agenda</h2>
    <p id="scheduleText" class="muted small"></p>
  </section>

  <section id="reportCard" class="card hidden">
    <h2>Última execução</h2>
    <p id="reportHead" class="muted small"></p>
    <ul id="reportLines" class="report"></ul>
  </section>

  <script src="popup.js" type="module"></script>
</body>
</html>
