name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar devDependencies
        run: npm ci

      - name: Syntax check + Lint + Testes
        run: |
          npm run check
          npm run lint
          npm test

      - name: Empacotar extensão (.zip + SHA256SUMS.txt)
        run: npm run pack

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
