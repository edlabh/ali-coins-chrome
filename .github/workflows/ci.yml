name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sem dependências de runtime/dev: nenhum `npm ci` é necessário.
      - name: Syntax check (todos os módulos)
        run: npm run check

      - name: Testes unitários (node --test)
        run: npm test
